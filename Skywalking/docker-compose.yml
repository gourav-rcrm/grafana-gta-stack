version: '3.8'
services:
  oap:
    image: ghcr.io/apache/skywalking/oap:b83213705bdaaea3d4586e501a0cdf4238adac27@sha256:26c46607e67d36aa2303f9291373663d1666abc001a7ff671d161bb1cbbde1d9
    container_name: oap
    platform: linux/arm64
    ports:
      - "12800:12800"
      - "11800:11800"
    networks:
      - skywalking_network
    depends_on:
      - elasticsearch
    volumes:
      - oap_data:/skywalking/data

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch-oss:7.4.2
    container_name: elasticsearch
    platform: linux/amd64
    ports:
      - "9200:9200"
    networks:
      - skywalking_network
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data

  ui:
    image: ghcr.io/apache/skywalking/ui:b83213705bdaaea3d4586e501a0cdf4238adac27@sha256:ca85db410e85157c8e2be7b7d1b8922c2b47322f91fdb0576e4eaf52a1ac9032
    container_name: ui
    platform: linux/arm64
    ports:
      - "8080:8080"
    environment:
      SW_OAP_ADDRESS: "http://oap:12800"
    depends_on:
      - oap
    networks:
      - skywalking_network
    volumes:
      - ui_data:/skywalking/ui-data

networks:
  skywalking_network:
    driver: bridge

volumes:
  oap_data:
  elasticsearch_data:
  ui_data: